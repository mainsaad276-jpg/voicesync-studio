name = "voicesync-tts"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
AZURE_SPEECH_REGION = "centralindia"
# Sites allowed to use this voice proxy: the website, the Android app, local testing.
ALLOWED_ORIGINS = "https://mainsaad276-jpg.github.io,https://localhost,http://localhost,capacitor://localhost,http://localhost:8000"

# Per-visitor limit: 30 voice requests per minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# The Azure key is a secret, set once with:
#   npx wrangler secret put AZURE_SPEECH_KEY
