<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceSync Studio — Free Voiceover + Lip-Sync</title>
  <meta name="description" content="VoiceSync Studio: free text-to-speech voiceover with synced lip-sync character. Export audio (WAV/MP3) and video (WebM). 100% free, no API keys.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#127908;</span>
      <h1 data-i18n="app_title">VoiceSync Studio</h1>
      <span class="brand-tag" data-i18n="app_tagline">Free Voiceover + Lip-Sync</span>
    </div>
    <div class="topbar-actions">
      <select id="langToggle" class="lang-toggle select" aria-label="UI language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="studio" id="appRoot">

    <!-- Text editor + voice selection -->
    <section class="card editor-card" aria-labelledby="editor-heading">
      <h2 id="editor-heading" class="card-title" data-i18n="editor_title">Script Editor</h2>

      <label class="field-label" for="textInput" data-i18n="text_label">Your text</label>
      <textarea id="textInput" class="text-input" rows="6"
        data-i18n-ph="text_placeholder" placeholder="Type or paste your script here..."></textarea>
      <div class="editor-meta">
        <span id="charCount" class="char-count">0</span>
        <span class="char-count-label" data-i18n="chars">chars</span>
        <button id="btnDictate" class="btn btn-secondary btn-small" type="button" style="margin-inline-start:auto">
          <span aria-hidden="true">&#127908;</span>
          <span data-i18n="btn_dictate">Voice to Text</span>
        </button>
      </div>

      <div class="controls-grid">
        <div class="field">
          <label class="field-label" for="ttsLang" data-i18n="language_label">Language</label>
          <select id="ttsLang" class="select">
            <option value="ur">اردو (Urdu)</option>
            <option value="en" selected>English</option>
            <option value="af">Afrikaans</option>
            <option value="sq">Albanian</option>
            <option value="am">Amharic</option>
            <option value="ar">Arabic</option>
            <option value="hy">Armenian</option>
            <option value="az">Azerbaijani</option>
            <option value="eu">Basque</option>
            <option value="bn">Bengali</option>
            <option value="bs">Bosnian</option>
            <option value="bg">Bulgarian</option>
            <option value="my">Burmese</option>
            <option value="ca">Catalan</option>
            <option value="ceb">Cebuano</option>
            <option value="zh">Chinese</option>
            <option value="hr">Croatian</option>
            <option value="cs">Czech</option>
            <option value="da">Danish</option>
            <option value="nl">Dutch</option>
            <option value="eo">Esperanto</option>
            <option value="et">Estonian</option>
            <option value="fil">Filipino</option>
            <option value="fi">Finnish</option>
            <option value="fr">French</option>
            <option value="gl">Galician</option>
            <option value="ka">Georgian</option>
            <option value="de">German</option>
            <option value="el">Greek</option>
            <option value="gu">Gujarati</option>
            <option value="ht">Haitian Creole</option>
            <option value="haw">Hawaiian</option>
            <option value="he">Hebrew</option>
            <option value="hi">Hindi</option>
            <option value="hmn">Hmong</option>
            <option value="hu">Hungarian</option>
            <option value="is">Icelandic</option>
            <option value="ig">Igbo</option>
            <option value="id">Indonesian</option>
            <option value="ga">Irish</option>
            <option value="it">Italian</option>
            <option value="ja">Japanese</option>
            <option value="jv">Javanese</option>
            <option value="kn">Kannada</option>
            <option value="kk">Kazakh</option>
            <option value="km">Khmer</option>
            <option value="ko">Korean</option>
            <option value="ku">Kurdish</option>
            <option value="ky">Kyrgyz</option>
            <option value="lo">Lao</option>
            <option value="la">Latin</option>
            <option value="lv">Latvian</option>
            <option value="lt">Lithuanian</option>
            <option value="lb">Luxembourgish</option>
            <option value="mk">Macedonian</option>
            <option value="mg">Malagasy</option>
            <option value="ms">Malay</option>
            <option value="ml">Malayalam</option>
            <option value="mt">Maltese</option>
            <option value="mi">Maori</option>
            <option value="mr">Marathi</option>
            <option value="mn">Mongolian</option>
            <option value="ne">Nepali</option>
            <option value="nb">Norwegian</option>
            <option value="ps">Pashto</option>
            <option value="fa">Persian</option>
            <option value="pl">Polish</option>
            <option value="pt">Portuguese</option>
            <option value="pa">Punjabi</option>
            <option value="ro">Romanian</option>
            <option value="ru">Russian</option>
            <option value="sm">Samoan</option>
            <option value="gd">Scots Gaelic</option>
            <option value="sr">Serbian</option>
            <option value="st">Sesotho</option>
            <option value="sn">Shona</option>
            <option value="sd">Sindhi</option>
            <option value="si">Sinhala</option>
            <option value="sk">Slovak</option>
            <option value="sl">Slovenian</option>
            <option value="so">Somali</option>
            <option value="es">Spanish</option>
            <option value="su">Sundanese</option>
            <option value="sw">Swahili</option>
            <option value="sv">Swedish</option>
            <option value="tg">Tajik</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="th">Thai</option>
            <option value="tr">Turkish</option>
            <option value="uk">Ukrainian</option>
            <option value="uz">Uzbek</option>
            <option value="vi">Vietnamese</option>
            <option value="cy">Welsh</option>
            <option value="xh">Xhosa</option>
            <option value="yi">Yiddish</option>
            <option value="yo">Yoruba</option>
            <option value="zu">Zulu</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="voiceSelect" data-i18n="voice_label">Voice</label>
          <select id="voiceSelect" class="select">
            <option value="" data-i18n="voice_loading">Loading voices…</option>
          </select>
        </div>
      </div>

      <div class="dialogue-row">
        <label class="check-label">
          <input type="checkbox" id="dialogueMode">
          <span data-i18n="dialogue_mode">Dialogue mode (two voices)</span>
        </label>
        <select id="voiceSelect2" class="select" hidden aria-label="Voice 2"></select>
      </div>
      <p class="hint" id="dialogueHint" hidden data-i18n="dialogue_hint">Start lines with 1: for Voice 1 and 2: for Voice 2.</p>
    </section>

    <!-- Avatar preview + transport + timeline -->
    <section class="card preview-card" aria-labelledby="preview-heading">
      <h2 id="preview-heading" class="card-title" data-i18n="preview_title">Preview</h2>

      <div id="avatarMount" class="avatar-mount" aria-label="Talking character preview"></div>

      <div class="transport">
        <button id="btnGenerate" class="btn btn-primary" type="button">
          <span aria-hidden="true">&#127908;</span>
          <span data-i18n="btn_generate">Generate Voice</span>
        </button>
        <button id="btnPlay" class="btn btn-primary" type="button">
          <span aria-hidden="true">&#9654;</span>
          <span data-i18n="btn_play">Play</span>
        </button>
        <button id="btnStop" class="btn btn-secondary" type="button">
          <span aria-hidden="true">&#9632;</span>
          <span data-i18n="btn_stop">Stop</span>
        </button>
        <button id="btnRecord" class="btn btn-secondary" type="button">
          <span aria-hidden="true">&#127908;</span>
          <span data-i18n="btn_record">Record My Voice</span>
        </button>
      </div>

      <div class="tuning">
        <div class="tuning-row">
          <label for="speedRange"><span data-i18n="tune_speed">Speed</span> <span id="speedVal" class="tune-val">1.0×</span></label>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1" aria-label="Speed">
        </div>
        <div class="tuning-row">
          <label for="pitchRange"><span data-i18n="tune_pitch">Pitch</span> <span id="pitchVal" class="tune-val">0</span></label>
          <input type="range" id="pitchRange" min="-12" max="12" step="1" value="0" aria-label="Pitch">
        </div>
      </div>

      <div class="music-row">
        <label class="btn btn-secondary btn-small" for="musicFile" style="cursor:pointer">
          <span aria-hidden="true">&#127925;</span>
          <span data-i18n="btn_music">Music</span>
        </label>
        <input type="file" id="musicFile" accept="audio/*" hidden>
        <input type="range" id="musicVol" min="0" max="50" value="20" aria-label="Music volume" title="Music volume">
        <span id="musicName" class="music-name"></span>
        <button id="btnMusicClear" class="btn btn-secondary btn-small" type="button" hidden aria-label="Remove music">×</button>
      </div>

      <div id="moduleStatus" class="module-status" aria-label="Module status"></div>

      <div id="timeline" class="timeline" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Playback progress">
        <div id="progress" class="progress"></div>
      </div>
      <div class="timeline-meta"><span id="timeLabel" class="time-label">0:00 / 0:00</span></div>

      <p id="statusMsg" class="status" role="status" data-i18n="status_ready">Ready — type your text and press Play.</p>
    </section>

    <!-- Export + project -->
    <section class="card export-card" aria-labelledby="export-heading">
      <h2 id="export-heading" class="card-title" data-i18n="export_title">Export</h2>

      <div class="btn-group">
        <button id="btnWav" class="btn btn-accent" type="button">
          <span aria-hidden="true">&#128190;</span>
          <span data-i18n="btn_wav">Download WAV</span>
        </button>
        <button id="btnMp3" class="btn btn-accent" type="button">
          <span aria-hidden="true">&#127925;</span>
          <span data-i18n="btn_mp3">Download MP3</span>
        </button>
        <button id="btnVideo" class="btn btn-accent" type="button">
          <span aria-hidden="true">&#127909;</span>
          <span data-i18n="btn_export_video">Download Video</span>
        </button>
        <button id="btnSrt" class="btn btn-accent" type="button">
          <span aria-hidden="true">&#128196;</span>
          <span data-i18n="btn_srt">Subtitles (SRT)</span>
        </button>
      </div>

      <h2 class="card-title project-title" data-i18n="project_title">Project</h2>
      <div class="btn-group">
        <button id="btnSave" class="btn btn-secondary" type="button">
          <span aria-hidden="true">&#128427;</span>
          <span data-i18n="btn_save_project">Save Project</span>
        </button>
        <button id="btnLoad" class="btn btn-secondary" type="button">
          <span aria-hidden="true">&#128193;</span>
          <span data-i18n="btn_load_project">Load Project</span>
        </button>
        <input type="file" id="fileLoad" accept="application/json,.json" hidden>
      </div>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p><span data-i18n="footer_text">100% free — no API keys, no sign-up.</span> <span class="footer-tech" data-i18n="footer_tech">Edge Neural → Google → Web Speech fallbacks</span></p>
  </footer>

  <!-- Module scripts — strict load order per SPEC §3. Missing modules must not
       break parsing; app.js feature-detects each global before wiring it. -->
  <script src="js/i18n.js"></script>
  <!-- Gradio client for the Chatterbox human-like voice engine (keyless, free). -->
  <script src="https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/lipsync.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
