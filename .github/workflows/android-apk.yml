name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['progress/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: QA gate
        run: bash qa/run-qa.sh

      - name: Prepare web assets
        run: node scripts/build-www.js

      - name: Release keystore (only if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Release signing: OFF (add ANDROID_KEYSTORE_BASE64 secret to enable)"
            exit 0
          fi
          # Find the keystore inside whatever was pasted (extra words, the whole
          # file, line breaks): take the longest base64 run, then validate it.
          printf '%s' "$KS_B64" > "$RUNNER_TEMP/ks.txt"
          python3 - "$RUNNER_TEMP/ks.txt" "$RUNNER_TEMP/release.keystore" <<'PY'
          import base64, re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          runs = re.findall(r'[A-Za-z0-9+/=]{200,}', raw)
          if not runs or len(max(runs, key=len)) < 2000:
              runs = re.findall(r'[A-Za-z0-9+/=]{200,}', re.sub(r'\s+', '', raw))
          best = max(runs, key=len) if runs else ''
          info = f"pasted {len(raw)} chars, keystore text found {len(best)} chars (expected 3624), starts with MII: {best.startswith('MII')}"
          try:
              data = base64.b64decode(best + '=' * (-len(best) % 4), validate=True)
              assert len(data) > 1000 and data[:1] == b'0'
          except Exception:
              print(f"::warning::Play Store signing skipped: keystore secret is not valid ({info}). Re-paste the long line that starts with MII. The test APK is still built.")
              sys.exit(0)
          open(sys.argv[2], 'wb').write(data)
          open(sys.argv[2] + '.info', 'w').write(info)
          print('Keystore decoded:', info)
          PY
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then exit 0; fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "${KS_ALIAS:-voicesync}" >/dev/null 2>&1; then
            INFO=$(cat "$RUNNER_TEMP/release.keystore.info")
            echo "::warning::Play Store signing skipped: keystore could not be opened ($INFO). If the found length is not 3624 the long line was cut, re-paste it; otherwise check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (voicesync). The test APK is still built."
            exit 0
          fi
          echo "Release signing: ON (keystore, password and alias verified)"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Create Android project
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1d5c4d' --iconBackgroundColorDark '#1d5c4d' \
            --splashBackgroundColor '#1d5c4d' --splashBackgroundColorDark '#1d5c4d'
          node scripts/patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Play Store bundle (AAB, release-signed)
        if: env.RELEASE_KEYSTORE_PATH != ''
        continue-on-error: true
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12 keystores use one password for store and key.
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew bundleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/bundle.log"; then
            # Surface the real reason as annotations (secrets are masked by GitHub).
            grep -E "What went wrong|error:|Error:|Exception|FAILURE|> " "$RUNNER_TEMP/bundle.log" | grep -v "^> Task" | head -12 | while IFS= read -r line; do
              echo "::warning::bundleRelease: $line"
            done
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/VoiceSync-Studio.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/VoiceSync-Studio-PlayStore.aab
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceSync-Studio-apk
          path: out/

      - name: Publish to apk branch and release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-build-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.ref_name }}
        run: |
          TAG=android-latest
          [ "$SRC" != "main" ] && TAG=android-test
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/VoiceSync-Studio.apk $(ls out/*.aab 2>/dev/null) \
            --title "VoiceSync Studio Android (build ${{ github.run_number }})" \
            --notes "APK built from ${{ github.sha }} on branch $SRC. Install: download VoiceSync-Studio.apk on the phone and open it." \
            --target "${{ github.sha }}" $([ "$SRC" != "main" ] && echo --prerelease)
          BR=apk; [ "$SRC" != "main" ] && BR=apk-test
          cd out
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${{ github.sha }} (run ${{ github.run_number }})" > BUILD.txt
          git add -A && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BR"
