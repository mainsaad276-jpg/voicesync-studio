name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['progress/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: QA gate
        run: bash qa/run-qa.sh

      - name: Prepare web assets
        run: node scripts/build-www.js

      - name: Release keystore (only if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing: ON"
          else
            echo "Release signing: OFF (add ANDROID_KEYSTORE_BASE64 secret to enable)"
          fi

      - name: Create Android project
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1d5c4d' --iconBackgroundColorDark '#1d5c4d' \
            --splashBackgroundColor '#1d5c4d' --splashBackgroundColorDark '#1d5c4d'
          node scripts/patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Play Store bundle (AAB, release-signed)
        if: env.RELEASE_KEYSTORE_PATH != ''
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/VoiceSync-Studio.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/VoiceSync-Studio-PlayStore.aab
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceSync-Studio-apk
          path: out/

      - name: Publish to apk branch and release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-build-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.ref_name }}
        run: |
          TAG=android-latest
          [ "$SRC" != "main" ] && TAG=android-test
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/VoiceSync-Studio.apk $(ls out/*.aab 2>/dev/null) \
            --title "VoiceSync Studio Android (build ${{ github.run_number }})" \
            --notes "APK built from ${{ github.sha }} on branch $SRC. Install: download VoiceSync-Studio.apk on the phone and open it." \
            --target "${{ github.sha }}" $([ "$SRC" != "main" ] && echo --prerelease)
          BR=apk; [ "$SRC" != "main" ] && BR=apk-test
          cd out
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${{ github.sha }} (run ${{ github.run_number }})" > BUILD.txt
          git add -A && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BR"
