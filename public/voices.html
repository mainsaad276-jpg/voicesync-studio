<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice library — {brand}</title>
<meta name="description" content="Preview the voice library.">
<meta name="theme-color" content="#070b18">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div id="site-header"></div>
<header class="hero" style="padding:80px 0 40px"><div class="wrap"><span class="eyebrow">Voice library</span><h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Hear the <span class="grad-text">voices</span></h1><p class="lead">Preview library voices below. Sign up to use them — or clone your own in about a minute.</p></div></header>
<section class="section" style="padding-top:10px"><div class="wrap">
  <div class="row wrapr" style="margin-bottom:10px"><input id="vq" placeholder="Search by name…" style="flex:1;min-width:200px"><div class="chips" id="vg"></div><select id="vlang" style="width:auto"></select></div>
  <div id="vl"></div>
  <div class="cta" style="margin-top:40px"><h2>Want your own voice?</h2><p class="muted">Clone your voice from a 10–30 second sample and use it alongside the library.</p><a class="btn btn-primary btn-lg" href="/auth/register">Start free</a></div>
</div></section>
<div id="site-footer"></div>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/content.js"></script>
<script>document.addEventListener('vs:ready', async () => {
  const all = (await VS.api('/api/public-voices')).data; let a, f = { q: '', g: 'All', l: 'All' };
  document.querySelector('.hero .lead').textContent = `${all.length} ready-made voices across ${new Set(all.map(v => v.language)).size} languages — including Urdu and Hindi. Press ▶ to preview, then sign up to use them.`;
  const langs = ['All', ...new Set(all.map(v => v.language))];
  VS.$('#vlang').innerHTML = langs.map(l => `<option value="${l}">${l === 'All' ? 'All languages' : VS.flag(l) + ' ' + VS.langName(l)}</option>`).join('');
  const draw = () => {
    VS.$('#vg').innerHTML = ['All', 'Male', 'Female'].map(g => `<button class="chip ${f.g === g ? 'on' : ''}" data-g="${g}">${g}</button>`).join('');
    const list = all.filter(v => (f.g === 'All' || v.gender === f.g) && (f.l === 'All' || v.language === f.l) && (!f.q || v.name.toLowerCase().includes(f.q)));
    const groups = {}; list.forEach(v => (groups[VS.langName(v.language)] = groups[VS.langName(v.language)] || []).push(v));
    VS.$('#vl').innerHTML = list.length ? Object.entries(groups).map(([k, vs]) => `<h3 style="margin:28px 0 12px">${VS.flag(vs[0].locale || vs[0].language)} ${k} <span class="dim" style="font-size:14px">· ${vs.length} voices</span></h3><div class="voice-list" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${vs.map(x => `<div class="voice-item"><span class="avatar">${VS.esc(x.name[0]).toUpperCase()}</span><span><b>${VS.esc(x.name)}</b><small>${VS.esc(x.gender)} · ${VS.flag(x.locale || x.language)} ${VS.langName(x.language)}</small></span>${x.sample ? `<button class="play-btn" data-play="${x.sample}" aria-label="Preview">▶</button>` : ''}</div>`).join('')}</div>`).join('') : '<div class="empty">No voices match.</div>';
  };
  draw();
  VS.$('#vq').oninput = e => { f.q = e.target.value.toLowerCase(); draw(); };
  VS.$('#vlang').onchange = e => { f.l = e.target.value; draw(); };
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-g]'); if (g) { f.g = g.dataset.g; draw(); return; }
    const b = e.target.closest('[data-play]'); if (!b) return; a?.pause(); if (b.textContent === '■') { b.textContent = '▶'; return; } VS.$$('[data-play]').forEach(x => x.textContent = '▶'); a = new Audio(b.dataset.play); a.play(); b.textContent = '■'; a.onended = () => b.textContent = '▶';
  });
});</script>
</body>
</html>
